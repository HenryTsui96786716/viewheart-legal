    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;
      padding: 20px;
    }
    .container { max-width: 820px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    h1 { font-size: 1.5rem; font-weight: 700; }
    .lang-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .lang-btn {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
    }
    .tabs { display: flex; gap: 12px; margin-bottom: 24px; }
    .tab-btn {
      flex: 1;
      padding: 12px;
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      border-color: var(--accent);
      color: #fff;
      background: rgba(217, 102, 255, 0.15);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
    }
    h2 { font-size: 1.25rem; color: #fff; margin: 20px 0 10px; }
    h2:first-child { margin-top: 0; }
    p, li { color: var(--muted); font-size: 0.95rem; margin-bottom: 10px; }
    ul { padding-left: 20px; margin-bottom: 14px; }
    strong { color: var(--text); }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 20px 0;
    }
    footer a { color: var(--accent); }
  </style>
</head>

      render();
    }

    function setTab(tab) {
      currentTab = tab === 'terms' ? 'terms' : 'privacy';
      updateURL();
      render();
    }

    // 支援網址參數直接開啟指定分頁與語言，例如 ?lang=en&tab=terms
    const params = new URLSearchParams(window.location.search);
    if (params.get('tab') === 'terms') currentTab = 'terms';
    if (params.get('tab') === 'privacy') currentTab = 'privacy';
    if (params.get('lang') && data[params.get('lang')]) {
      currentLang = params.get('lang');
    }
    render();
  </script>
</body>
</html>
